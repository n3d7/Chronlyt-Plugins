[workspace]
members = ["crates/chronlyt-plugin-contracts", "crates/chronlyt-plugin-validator", "tools/chronlyt-registry"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/n3d7/Chronlyt-Plugins"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
url = "=2.5.8"
sha2 = "=0.10.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wasmparser = { version = "=0.236.1", default-features = false, features = ["std", "validate", "features", "component-model", "simd"] }
wit-parser = { version = "=0.236.1", default-features = false }
wat = "=1.258.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "blocking"] }
tempfile = "=3.27.0"
base64 = "=0.22.1"
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }
yaml-rust2 = { version = "=0.12.0", default-features = false }
